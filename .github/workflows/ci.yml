name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore --locked-mode
      - run: dotnet test --no-restore --configuration Release --filter 'Category!=Storage'
      - run: npm ci && npm run build
        working-directory: web
  sql-and-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start SQL Server and Azurite
        shell: pwsh
        run: ./scripts/start-infra.ps1
      - name: Run real database and FFmpeg integration suite
        shell: pwsh
        run: ./scripts/test.ps1 -SqlServer -Storage
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: artifacts/TestResults
          if-no-files-found: ignore
