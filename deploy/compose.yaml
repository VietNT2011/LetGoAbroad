name: englishhub
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04@sha256:db9a8fe3098b7e8bbde41106bdc7caee942e97124e5fdb71b872ca208de3092d
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/start-infra.ps1 first}
      MSSQL_PID: Developer
    ports: ['127.0.0.1:14333:1433']
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      retries: 20
      start_period: 30s
    mem_limit: 3g
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: englishhub:${AZURITE_ACCOUNT_KEY:?Run scripts/start-infra.ps1 first}
    ports: ['127.0.0.1:10000:10000']
    volumes: [blob-data:/data]
  redis:
    image: redis:7.4.2-alpine
    profiles: [social]
    ports: ['127.0.0.1:16379:6379']
  livekit:
    image: livekit/livekit-server:v1.9.3
    profiles: [calls]
    command: --dev --bind 0.0.0.0
    ports: ['127.0.0.1:7880:7880', '7881:7881', '7882:7882/udp']
  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    ports: ['127.0.0.1:5188:8080']
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      Database__Initialize: 'true'
      Seed__Demo: 'true'
      FeatureFlags__EnableMedia: 'true'
      ConnectionStrings__Database: Server=sql;Database=EnglishHub;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=englishhub;AccountKey=${AZURITE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/englishhub;
      Storage__PublicEndpoint: http://127.0.0.1:10000/englishhub
      Storage__ConfigureLocalCors: 'true'
    volumes: [data-protection:/home/app/.aspnet/DataProtection-Keys]
    depends_on:
      sql: {condition: service_healthy}
      azurite: {condition: service_started}
    mem_limit: 768m
  worker:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    environment:
      Database__Provider: SqlServer
      FeatureFlags__EnableMedia: 'true'
      ConnectionStrings__Database: Server=sql;Database=EnglishHub;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=englishhub;AccountKey=${AZURITE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/englishhub;
    depends_on:
      api: {condition: service_started}
    mem_limit: 768m
    cpus: '1'
volumes:
  sql-data:
  blob-data:
  data-protection:
